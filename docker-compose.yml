version: '3.8'

# ── MKR Commerce Backend — Local Dev Services ────────────────────────────────
#
# Start everything:   docker-compose up -d
# Stop everything:    docker-compose down
# Wipe DB data:       docker-compose down -v
#
# PostgreSQL will be available at: localhost:5432
# pgAdmin (DB browser) at:         http://localhost:5050
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:15-alpine
    container_name: mkr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mkr_commerce
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mkr_commerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mkr_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@mkr.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    name: mkr_postgres_data
