# ── Server ─────────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=mkr-commerce-backend

# ── Profile (dev locally, overridden by SPRING_PROFILES_ACTIVE env var on Render) ──
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── JWT defaults (overridden per profile; required here because profile ────────
# ── activation happens before placeholder resolution in application.properties) ─
app.jwt.secret=${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiry-ms=${APP_JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${APP_JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
